<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MediPredict{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="{{ url_for('home') }}" class="brand">
                <span class="brand-icon">&#10084;</span>
                <span class="brand-name">MediPredict</span>
            </a>

            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>

            <nav class="site-nav" id="siteNav">
                <a href="{{ url_for('home') }}" class="{% if active_page == 'home' %}active{% endif %}">Home</a>
                <a href="{{ url_for('insight') }}" class="{% if active_page == 'insight' %}active{% endif %}">Insights</a>
                <a href="{{ url_for('predict') }}" class="{% if active_page == 'predict' %}active{% endif %}">Predict</a>
                <a href="{{ url_for('about') }}" class="{% if active_page == 'about' %}active{% endif %}">About</a>
                <a href="{{ url_for('contact') }}" class="{% if active_page == 'contact' %}active{% endif %}">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 MediPredict &mdash; Machine Learning Powered Health Insights by VAIDIK KHANDELWAL</p>
        </div>
    </footer>

    <script>
        // Simple mobile nav toggle -- no external JS libraries used.
        const navToggle = document.getElementById('navToggle');
        const siteNav = document.getElementById('siteNav');
        navToggle.addEventListener('click', function () {
            siteNav.classList.toggle('open');
            navToggle.classList.toggle('open');
        });
    </script>
</body>
</html>
